name: Release

# Publie une release GitHub quand une étiquette vX.Y.Z est poussée.
# Les notes viennent de docs/RELEASE-vX.Y.Z.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/RELEASE-${TAG}.md"
          test -f "$notes"
          gh release create "$TAG" --verify-tag --latest --title "Classement BUT1 ${TAG}" --notes-file "$notes"
